<style>

  @media (max-width: 760px) { html { font-size: 15px; } }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 1rem; line-height: 1.45; -webkit-font-smoothing: antialiased; transition: background .3s var(--ease), color .3s var(--ease); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; padding: .6rem .95rem; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-weight: 600; font-size: .9rem; line-height: 1; transition: transform .12s var(--ease), background .18s, border-color .18s, box-shadow .18s; white-space: nowrap; text-decoration: none; min-height: 2.5rem; }

  .controls .grow { flex: 1; min-width: .5rem; }

  .c { font-weight: 700; white-space: nowrap; }
  td.flag { box-shadow: inset 0 0 0 2px var(--danger); background: var(--danger-soft); }

  /* ---------- agent ---------- */
  .side { display: flex; flex-direction: column; gap: .8rem; min-width: 0; }

  @keyframes dotp { 0% { box-shadow: 0 0 0 0 rgba(77,124,254,.6); } 100% { box-shadow: 0 0 0 .5rem rgba(77,124,254,0); } }

  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .45rem; }

  .tile.hot b { color: var(--danger); } .tile.good b { color: var(--channel); }

  /* ---------- slot ---------- */
  .slot { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: .65rem .9rem .75rem; min-height: 16rem; }

  .kpi .v { font-size: 1.3rem; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .kpi .d { font-size: .72rem; color: var(--text-3); }

  .bars li { display: grid; grid-template-columns: minmax(0, 9.5rem) minmax(0, 1fr) 6.6rem; gap: .5rem; align-items: center; margin: .22rem 0; font-size: .86rem; }
  .bn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bars b { text-align: right; font-variant-numeric: tabular-nums; }
  .bt { display: block; height: .6rem; background: var(--bg-2); border-radius: 4px; overflow: hidden; }

  .rp { margin-top: .5rem; font-size: .88rem; display: grid; gap: .2rem; }
  .rp li { padding-left: 1rem; position: relative; line-height: 1.3; }

  .ap-list li { padding: .35rem 0 .35rem 1.5rem; position: relative; font-size: .98rem; border-top: 1px solid var(--line); }
  .ap-list li:first-child { border-top: 0; }
